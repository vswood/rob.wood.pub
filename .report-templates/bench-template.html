      rel="icon"
      type="image/png"

      sizes="96x96" />

      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdelivr.net/gh/virtualstyle/dev-base/img/favicon/favicon.svg" />

    <meta name="theme-color" content="#ffffff" />

      href="https://cdn.jsdelivr.net/gh/virtualstyle/dev-base/css/vs-hf-base.css"

    <style>
      header,
      footer {
        padding: 0 1em;
      }
      footer {
        text-align: center;
        padding-top: 0.5em;
      }
      main {
        min-height: 75vh;
        padding: 1em;
      }

      .bench-results {
        font-family:
          ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas,
          'DejaVu Sans Mono', monospace;
        font-size: 0.95rem;
        line-height: 1.5;
        width: fit-content;
        margin: auto;
        padding: 1em;
        border: 5px double #efefef;
        border-radius: 4px;
        box-shadow:
          rgba(0, 0, 0, 0.4) 0px 2px 4px,
          rgba(0, 0, 0, 0.3) 0px 7px 13px -3px,
          rgba(0, 0, 0, 0.2) 0px -3px 0px inset;
      }
      .bench {
        border-radius: 4px;
      }
      .bench.header {
        display: flex;
        gap: 1em;
        align-items: center;
        border: none;
        margin-bottom: 0.75em;
        font-weight: bold;
        span.label {
          border: none;
          background: #047878;
          color: #ffffff;
          font-weight: bold;
          padding: 0.15em 0.75em;
        }
        span.version {
          border: none;
          color: #780474;
          font-weight: bold;
        }
        span.project {
          border: none;
          font-weight: bold;
          margin-left: 0.5em;
          display: inline-block;
          flex: 1;
          text-align: right;
        }
      }
      .bench.data {
        display: table;
      }
      .bench.data-line {
        display: table-row;
        .cell {
          display: table-cell;
          padding: 0 0.5em;
        }
        .header.cell {
          font-weight: bold;
          text-align: center;
        }
      }
      .bench.data-header {
        display: flex;
        border-bottom: 1px solid #cfcfcf;
        background: #efefef;
        span.timer {
          flex-grow: 1;
          color: #d92662;
          font-weight: bold;
          text-align: right;
        }
        span.filename {
          font-weight: bold;
          color: #007a50;
        }
      }
      .bench.footer-line {
        span.top-obj {
          font-weight: bold;
          color: #007a50;
        }
        span.speed-diff {
          font-weight: bold;
          color: #007a50;
        }
      }
      .bench.data,
      .bench.summary,
      .bench.footer-line {
        border: none;
        &.odd {
          border-bottom: 1px solid #cfcfcf;
        }
      }
      .bench.test-run {
        margin: 0;
        margin: 0.75em 0 1em 0;
      }
      .bench.data {
        margin: 0;
      }
      .bench.summary {
        margin: 1em 0;
      }
      .bench.footer-line {
        margin: 0 1em;
        &:nth-child(odd) {
          padding-left: 2.5em;
        }
      }
    </style>
  </head>
