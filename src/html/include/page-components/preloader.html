<div id="preloader">
  <style>
    #preloader {
      visibility: hidden;
    }

    @keyframes delay {

      0%,
      40%,
      100% {
        transform: scaleY(0.05);
        -webkit-transform: scaleY(0.05);
      }

      20% {
        transform: scaleY(1);
        -webkit-transform: scaleY(1);
      }
    }

    .loader {
      margin: 0 auto;
      width: 60px;
      height: 50px;
      text-align: center;
      font-size: 10px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translateY(-50%) translateX(-50%);
      z-index: 500;
      opacity: 1;

      div {
        height: 100%;
        width: 8px;
        display: inline-block;
        float: left;
        margin-left: 2px;
        -webkit-animation: delay 0.8s infinite ease-in-out;
        animation: delay 0.8s infinite ease-in-out;

        &.bar1 {
          background-color: #754fa0;
        }

        &.bar2 {
          background-color: #09b7bf;
          -webkit-animation-delay: -0.7s;
          animation-delay: -0.7s;
        }

        &.bar3 {
          background-color: #90d36b;
          -webkit-animation-delay: -0.6s;
          animation-delay: -0.6s;
        }

        &.bar4 {
          background-color: #f2d40d;
          -webkit-animation-delay: -0.5s;
          animation-delay: -0.5s;
        }

        &.bar5 {
          background-color: #fcb12b;
          -webkit-animation-delay: -0.4s;
          animation-delay: -0.4s;
        }

        &.bar6 {
          background-color: #ed1b72;
          -webkit-animation-delay: -0.3s;
          animation-delay: -0.3s;
        }
      }
    }
  </style>
  <script>
    window.vsAppLoaded = false
    setTimeout(() => {
      if (window.vsAppLoaded !== true) {
        document.getElementById('preloader').style.visibility = 'visible'
      }
    }, 330)

    function createParticle() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 20 + 10,
        opacity: Math.random() * 0.15 + 0.05,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5
      }
    }
    function drawFog() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)

      fogParticles.forEach(p => {
        // Simple movement
        p.x += p.speedX
        p.y += p.speedY

        // Wrap around canvas edges
        if (p.x > canvas.width + p.radius) p.x = -p.radius
        if (p.x < -p.radius) p.x = canvas.width + p.radius
        if (p.y > canvas.height + p.radius) p.y = -p.radius
        if (p.y < -p.radius) p.y = canvas.height + p.radius

        // Interaction: push particles away from mouse
        const dx = p.x - mouseX
        const dy = p.y - mouseY
        const distance = Math.sqrt(dx * dx + dy * dy)
        const interactionRadius = 100

        if (distance < interactionRadius) {
          const force = (interactionRadius - distance) / interactionRadius
          p.x += dx / distance * force * 2
          p.y += dy / distance * force * 2
        }

        ctx.beginPath()
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2)
        ctx.fillStyle = `rgba(107, 183, 255, ${p.opacity})`
        ctx.fill()
      })

      requestAnimationFrame(drawFog)
    }
  </script>
  <canvas id="fogCanvas"></canvas>
  <div class="loader">
    <div class="bar1"></div>
    <div class="bar2"></div>
    <div class="bar3"></div>
    <div class="bar4"></div>
    <div class="bar5"></div>
    <div class="bar6"></div>
  </div>
  <script>
    // fog.js
    const canvas = document.getElementById('fogCanvas')
    const ctx = canvas.getContext('2d')
    canvas.width = window.innerWidth
    canvas.height = window.innerHeight

    let fogParticles = []
    const numParticles = 100
    let mouseX = -100, mouseY = -100 // Initialize off-screen

    for (let i = 0; i < numParticles; i++) {
      fogParticles.push(createParticle())
    }

    drawFog();
  </script>
</div>
