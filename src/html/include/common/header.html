<div class="menu-wrap">
  <header id="header" class="header offcanvas-menu offcanvas-wrapper">

    <div class="header-top">
      <div class="profile-img">
        <img src="../../../img/profile/working-at-laptop.png" alt="" class="img-fluid">
      </div>

      <a href="index.html">
        <h1 class="sitename">Rob Wood</h1>
      </a>
      <div class="headline">
        Transformative Engineer<br>
      </div>

    </div>
    {% include "../common/nav.html" %}

    <div class="social-links text-center">
      {% for item in social %}

            {% icon item.iconid, '{ "width": "16", "height": "16" }' %}
          <span class="visually-hidden">{{item.text}}</span>
        </a>
      {% endfor %}
    </div>
  </header>
