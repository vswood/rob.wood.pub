<footer id="footer" class="footer light-background">
  <div class="container">
    <h3 class="sitename">Rob Wood</h3>

    <p>Realizing the Promise of Technology Through Cost-Effective Measurable Outcomes</p>

    <div class="social-links d-flex justify-content-center">
      {% for item in social %}
        <a href="{{item.link}}" target="_blank" data-bs-toggle="tooltip" data-bs-custom-class="custom-tooltip" data-bs-placement="top" data-bs-delay='{"show":400,"hide":150}' data-bs-title="{{item.description}}" aria-label="{{item.description}}">
            {% icon item.iconid, '{ "width": "24", "height": "24" }' %}
          <span class="visually-hidden">{{item.text}}</span>
        </a>
      {% endfor %}
    </div>
    <div class="container">
      <div class="copyright">
        <span>Copyright</span> &copy; 2026 <strong class="px-1">Rob Wood</strong><br><span>All Rights Reserved</span>
      </div>
      <div class="credits">
        <!-- All the links in the footer should remain intact. -->
        <!-- You can delete the links only if you've purchased the pro version. -->
        <!-- Licensing information: https://bootstrapmade.com/license/ -->
        <!-- Purchase the pro version with working PHP/AJAX contact form: [buy-url] -->
        Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a> | <a
          href="https://bootstrapmade.com/tools/">DevTools</a>
      </div>
    </div>
  </div>
</footer>
