<style>
  /* Base Layout Grid to match your site's structural blueprint */
  .skeleton-container {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
    background-color: #1a252f; /* Matching your dark aesthetic */
    box-sizing: border-box;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Sidebar styling */
  .skeleton-sidebar {
    background-color: #111a22;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid #243443;
  }

  .skeleton-nav {
    width: 100%;
    margin-top: 40px;
  }

  /* Main Content styling */
  .skeleton-main {
    padding: 60px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .skeleton-actions {
    display: flex;
    gap: 20px;
  }

  .skeleton-stats {
    display: flex;
    gap: 60px;
    margin-top: 40px;
  }

  .skeleton-stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  /* --- Core Shimmer Animation Engine --- */
  .skeleton-element {
    background: linear-gradient(
      90deg,
      #243443 25%,
      #2c3e50 37%,
      #243443 63%
    );
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  /* --- Element Sizing Blueprints --- */
  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 20px;
  }

  .circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
  }

  .nav-item {
    height: 24px;
    width: 80%;
    margin: 0 auto 20px auto;
    border-radius: 4px;
  }

  .title-line {
    height: 32px;
    margin-bottom: 15px;
  }

  .title-line.short { width: 40%; }
  .title-line.medium { width: 60%; }
  .title-line.large { width: 85%; }
  .title-line.text { height: 18px; width: 50%; }

  .text-block {
    height: 20px;
    width: 100%;
    margin-bottom: 12px;
  }
  .text-block.short { width: 75%; }

  .btn {
    width: 160px;
    height: 45px;
    border-radius: 6px;
  }

  /* Responsive adjustment for tablet/mobile viewports */
  @media (max-width: 768px) {
    .skeleton-container {
      grid-template-columns: 1fr;
    }
    .skeleton-sidebar {
      display: none; /* Hides sidebar block just like a mobile burger layout switch */
    }
    .skeleton-main {
      padding: 20px;
    }
    .skeleton-stats {
      flex-direction: column;
      gap: 30px;
    }
  }
</style>

<div id="skeleton-loader">

  <div class="skeleton-container">
    <aside class="skeleton-sidebar">
      <div class="skeleton-element avatar"></div>
      <div class="skeleton-element title-line short"></div>
      <div class="skeleton-element title-line text"></div>
      <nav class="skeleton-nav">
        <div class="skeleton-element nav-item"></div>
        <div class="skeleton-element nav-item"></div>
        <div class="skeleton-element nav-item"></div>
        <div class="skeleton-element nav-item"></div>
        <div class="skeleton-element nav-item"></div>
      </nav>
    </aside>

    <main class="skeleton-main">
      <header class="skeleton-header">
        <div class="skeleton-element title-line medium"></div>
        <div class="skeleton-element title-line large"></div>
        <div class="skeleton-element title-line text"></div>
      </header>

      <div class="skeleton-actions">
        <div class="skeleton-element btn"></div>
        <div class="skeleton-element btn"></div>
      </div>

      <section class="skeleton-body">
        <div class="skeleton-element title-line large"></div>
        <div class="skeleton-element text-block"></div>
        <div class="skeleton-element text-block short"></div>
      </section>

      <section class="skeleton-stats">
        <div class="skeleton-stat-item">
          <div class="skeleton-element circle"></div>
          <div class="skeleton-element title-line short"></div>
        </div>
        <div class="skeleton-stat-item">
          <div class="skeleton-element circle"></div>
          <div class="skeleton-element title-line short"></div>
        </div>
        <div class="skeleton-stat-item">
          <div class="skeleton-element circle"></div>
          <div class="skeleton-element title-line short"></div>
        </div>
      </section>
    </main>
  </div>

</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const loader = document.getElementById('skeleton-loader')
  if (loader) {
    loader.style.transition = 'opacity 0.4s ease'
    loader.style.opacity = '0'
    setTimeout(() => loader.remove(), 400)
  }
})
</script>
